name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what Raspberry Pi OS (bullseye) ships; 3.12 is what a
        # laptop is likely to have. The code has to work on both.
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check solarsweep tests

      - name: Test
        run: pytest -q --cov=solarsweep --cov-report=term-missing

      # The whole point of the simulator: the machine's failure modes are
      # exercised on every push, without a machine.
      - name: Fault injection
        run: |
          set -euo pipefail

          echo "--- a clean cycle must succeed"
          solarsweep --sim --time-scale 0 -q run --mode quick_pass

          echo "--- these faults must stop the cycle (non-zero exit)"
          for f in stuck_limit_home stuck_limit_far "drive_stall@600" \
                   "rain@5" "obstacle@800" "estop@4"; do
            if solarsweep --sim --time-scale 0 -q run --fault "$f"; then
              echo "FAIL: fault '$f' did not stop the cycle"
              exit 1
            fi
            echo "  ok: $f"
          done

          echo "--- no_water must degrade to a dry pass, not fail"
          solarsweep --sim --time-scale 0 -q run --mode quick_pass --fault no_water

          echo "--- an unknown fault name must be rejected"
          if solarsweep --sim -q run --fault definitely_not_a_fault 2>/dev/null; then
            echo "FAIL: unknown fault name was accepted"
            exit 1
          fi

      - name: Config files load
        run: |
          solarsweep -c config/settings.yaml --sim status > /dev/null
          solarsweep -c config/settings.as-built.yaml --sim status > /dev/null
